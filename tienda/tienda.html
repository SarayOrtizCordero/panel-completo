<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda de Pruebas — Demo Integración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/tienda.css">
</head>
<body>
<div class="app store-app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      </span>
      <h1>Tienda de Pruebas</h1>
    </div>
    <a class="btn-back" href="../index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Volver al panel de inventario
    </a>
  </header>

  <p class="store-intro">Compra aquí para ver cómo el <strong>Panel de Inventario</strong> descuenta el stock de la <strong>Tienda Online</strong> al instante. Abre el panel en otra pestaña, selecciona ese almacén, y compra algo aquí.</p>

  <div class="session-summary">
    <span><strong id="sessionCount">0</strong> compras en esta sesión</span>
    <span class="session-divider">·</span>
    <span>Total gastado: <strong id="sessionTotal">0,00 €</strong></span>
  </div>

  <div class="store-layout">
    <div class="store-grid" id="storeGrid"></div>

    <aside class="history-panel">
      <h3>Compras recientes</h3>
      <div class="history-list" id="historyList"></div>
    </aside>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/tienda.js"></script>
</body>
</html>
